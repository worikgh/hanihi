[package]
name = "agent-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rig = { package = "rig-core", version = "0.41.0" }
rmcp = { version = "3.1.2", default-features = false, features = ["client", "transport-child-process"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
rig = { package = "rig-core", version = "0.41.0", features = ["test-utils"] }
