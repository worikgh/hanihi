[package]
name = "hanihi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "A minimal tool-calling agent harness in Rust: agent loop, built-in tools, and MCP client support."
keywords = ["agent", "llm", "mcp", "rig", "tools"]
categories = ["development-tools"]

[lib]
name = "hanihi_core"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
fs2 = "0.4"
rig = { package = "rig-core", version = "0.41.0" }
rmcp = { version = "3.1.2", default-features = false, features = ["client", "transport-child-process"] }
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
rig = { package = "rig-core", version = "0.41.0", features = ["test-utils"] }
