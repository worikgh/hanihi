[package]
name = "hanihi-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Eval harness for hānihi: run test cases against a live LLM and check assertions against the session log."
keywords = ["agent", "llm", "eval", "testing", "hanihi"]
categories = ["development-tools::testing"]
publish = false

[dependencies]
hanihi-core = { version = "0.3.0", path = "../hanihi-core" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
rig = { package = "rig-core", version = "0.41.0" }
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { version = "1", features = ["v4"] }
